# Sized for the 1.5x-scaled 4K output; defaults are tuned for 1x and look cramped here.
font=Iosevka Nerd Font:size=13:weight=bold
dpi-aware=no

width=42
lines=8
horizontal-pad=28
vertical-pad=20
inner-pad=16
line-height=32

icon-theme=Papirus-Dark
icons-enabled=yes

[colors]
background=1a1b26ee
text=c0caf5ff
placeholder=565f89ff
prompt=7aa2f7ff
input=c0caf5ff
match=bb9af7ff
selection=16161eff
selection-text=c0caf5ff
selection-match=bb9af7ff
counter=565f89ff
border=7aa2f7ff

[border]
width=2
radius=12
